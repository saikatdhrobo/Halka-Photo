<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Advanced Image Compressor - Created by Jakaria Saikat Dhrobo</title>

<style>
:root{
    --bg:#0f172a;
    --card:#111827;
    --card2:#1f2937;
    --accent:#38bdf8;
    --text:#f8fafc;
    --muted:#94a3b8;
    --danger:#ef4444;
    --success:#22c55e;
    --border:#334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#020617,#0f172a,#111827);
    color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:1400px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    font-size:42px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:rgba(17,24,39,0.9);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    backdrop-filter:blur(8px);
}

.drop-zone{
    border:2px dashed var(--accent);
    border-radius:20px;
    padding:60px 20px;
    text-align:center;
    transition:0.3s;
    cursor:pointer;
    background:rgba(56,189,248,0.06);
}

.drop-zone:hover{
    transform:translateY(-3px);
}

.drop-zone.drag{
    background:rgba(56,189,248,0.15);
}

.drop-zone h2{
    margin-bottom:10px;
}

.drop-zone p{
    color:var(--muted);
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.control-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

label{
    font-size:14px;
    color:#e2e8f0;
}

input,
select,
button{
    padding:12px;
    border-radius:12px;
    border:none;
    outline:none;
}

input,
select{
    background:#0f172a;
    color:white;
    border:1px solid var(--border);
}

button{
    background:var(--accent);
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
}

.preview-wrapper{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:20px;
}

.preview-box{
    background:#0f172a;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}

.preview-header{
    padding:12px;
    border-bottom:1px solid var(--border);
    background:#020617;
}

.preview-image{
    width:100%;
    height:350px;
    object-fit:contain;
    background:black;
}

.info{
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:6px;
    color:var(--muted);
    font-size:14px;
}

.actions{
    display:flex;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

.progress{
    margin-top:20px;
    height:18px;
    background:#0f172a;
    border-radius:999px;
    overflow:hidden;
    border:1px solid var(--border);
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#22c55e,#38bdf8);
    transition:0.3s;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:var(--muted);
    font-size:15px;
}

.badge{
    display:inline-block;
    background:rgba(56,189,248,0.1);
    border:1px solid rgba(56,189,248,0.2);
    color:var(--accent);
    padding:8px 15px;
    border-radius:999px;
    margin-top:10px;
}

.hidden{
    display:none;
}

.toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.checkbox{
    width:18px;
    height:18px;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:20px;
}

.stat{
    background:#020617;
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    text-align:center;
}

.stat h3{
    font-size:14px;
    color:var(--muted);
    margin-bottom:8px;
}

.stat p{
    font-size:20px;
    font-weight:bold;
}

.range-label{
    color:var(--muted);
    font-size:13px;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    .preview-wrapper{
        grid-template-columns:1fr;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .stat-grid{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:32px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Halka Photo</h1>
        <div class="badge">
            Advanced Image Resizer & Compressor
        </div>
    </div>

    <div class="grid">

        <div class="card">

            <div class="drop-zone" id="dropZone">
                <h2>Drop Image Here</h2>
                <p>or click to select an image</p>

                <input 
                    type="file" 
                    id="fileInput" 
                    accept="image/*" 
                    class="hidden"
                >
            </div>

            <div class="controls">

                <div class="control-group">
                    <label>Width (px)</label>

                    <input 
                        type="number" 
                        id="widthInput" 
                        placeholder="Auto"
                    >
                </div>

                <div class="control-group">
                    <label>Height (px)</label>

                    <input 
                        type="number" 
                        id="heightInput" 
                        placeholder="Auto"
                    >
                </div>

                <div class="control-group">
                    <label>Compression Quality (1 - 100)</label>

                    <input 
                        type="number" 
                        id="qualityInput" 
                        min="1" 
                        max="100" 
                        value="80"
                    >
                </div>

                <div class="control-group">
                    <label>Output Format</label>

                    <select id="formatSelect">
                        <option value="image/jpeg">JPG</option>
                        <option value="image/png">PNG</option>
                        <option value="image/webp">WEBP</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Maintain Aspect Ratio</label>

                    <div class="toggle-row">
                        <input 
                            type="checkbox" 
                            id="aspectRatio" 
                            class="checkbox" 
                            checked
                        >

                        <span class="range-label">Enabled</span>
                    </div>
                </div>

            </div>

            <div class="actions">
                <button id="compressBtn">
                    Compress Image
                </button>

                <button id="resetBtn">
                    Reset
                </button>

                <button id="downloadBtn" disabled>
                    Download
                </button>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="stat-grid">

                <div class="stat">
                    <h3>Original Size</h3>
                    <p id="originalSize">0 KB</p>
                </div>

                <div class="stat">
                    <h3>Compressed Size</h3>
                    <p id="compressedSize">0 KB</p>
                </div>

                <div class="stat">
                    <h3>Reduction</h3>
                    <p id="reduction">0%</p>
                </div>

            </div>

        </div>

        <div class="card">

            <div class="preview-wrapper">

                <div class="preview-box">

                    <div class="preview-header">
                        Original Image
                    </div>

                    <img 
                        id="originalPreview" 
                        class="preview-image"
                    >

                    <div class="info" id="originalInfo">
                        <span>No image selected</span>
                    </div>

                </div>

                <div class="preview-box">

                    <div class="preview-header">
                        Compressed Image
                    </div>

                    <img 
                        id="compressedPreview" 
                        class="preview-image"
                    >

                    <div class="info" id="compressedInfo">
                        <span>Compressed image will appear here</span>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="footer">
        Created by Jakaria Saikat Dhrobo ❤️
    </div>

</div>

<script>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");

const qualityInput = document.getElementById("qualityInput");
const formatSelect = document.getElementById("formatSelect");

const aspectRatio = document.getElementById("aspectRatio");

const compressBtn = document.getElementById("compressBtn");
const resetBtn = document.getElementById("resetBtn");
const downloadBtn = document.getElementById("downloadBtn");

const originalPreview = document.getElementById("originalPreview");
const compressedPreview = document.getElementById("compressedPreview");

const originalInfo = document.getElementById("originalInfo");
const compressedInfo = document.getElementById("compressedInfo");

const originalSize = document.getElementById("originalSize");
const compressedSize = document.getElementById("compressedSize");
const reduction = document.getElementById("reduction");

const progressBar = document.getElementById("progressBar");

let selectedFile = null;
let compressedBlob = null;
let imageObject = null;

dropZone.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", (e) => {

    const file = e.target.files[0];

    if(file){
        loadImage(file);
    }
});

dropZone.addEventListener("dragover", (e) => {

    e.preventDefault();

    dropZone.classList.add("drag");
});

dropZone.addEventListener("dragleave", () => {

    dropZone.classList.remove("drag");
});

dropZone.addEventListener("drop", (e) => {

    e.preventDefault();

    dropZone.classList.remove("drag");

    const file = e.dataTransfer.files[0];

    if(file){
        loadImage(file);
    }
});

function loadImage(file){

    if(!file.type.startsWith("image/")){

        alert("Please select a valid image file.");

        return;
    }

    selectedFile = file;

    const reader = new FileReader();

    reader.onload = function(event){

        originalPreview.src = event.target.result;

        imageObject = new Image();

        imageObject.onload = function(){

            originalInfo.innerHTML = `
                <span><strong>Name:</strong> ${file.name}</span>
                <span><strong>Width:</strong> ${imageObject.width}px</span>
                <span><strong>Height:</strong> ${imageObject.height}px</span>
                <span><strong>Type:</strong> ${file.type}</span>
            `;

            originalSize.textContent = formatBytes(file.size);

            widthInput.value = imageObject.width;
            heightInput.value = imageObject.height;
        };

        imageObject.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

widthInput.addEventListener("input", () => {

    if(aspectRatio.checked && imageObject){

        const ratio = imageObject.height / imageObject.width;

        heightInput.value = Math.round(widthInput.value * ratio);
    }
});

heightInput.addEventListener("input", () => {

    if(aspectRatio.checked && imageObject){

        const ratio = imageObject.width / imageObject.height;

        widthInput.value = Math.round(heightInput.value * ratio);
    }
});

compressBtn.addEventListener("click", () => {

    if(!selectedFile || !imageObject){

        alert("Please select an image first.");

        return;
    }

    progressBar.style.width = "10%";

    setTimeout(() => {

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        const targetWidth =
            parseInt(widthInput.value) || imageObject.width;

        const targetHeight =
            parseInt(heightInput.value) || imageObject.height;

        canvas.width = targetWidth;
        canvas.height = targetHeight;

        if(formatSelect.value === "image/jpeg"){

            ctx.fillStyle = "#ffffff";

            ctx.fillRect(
                0,
                0,
                targetWidth,
                targetHeight
            );
        }

        ctx.drawImage(
            imageObject,
            0,
            0,
            targetWidth,
            targetHeight
        );

        progressBar.style.width = "60%";

        const quality =
            parseInt(qualityInput.value) / 100;

        canvas.toBlob((blob) => {

            compressedBlob = blob;

            const compressedUrl =
                URL.createObjectURL(blob);

            compressedPreview.src =
                compressedUrl;

            compressedInfo.innerHTML = `
                <span><strong>Width:</strong> ${targetWidth}px</span>
                <span><strong>Height:</strong> ${targetHeight}px</span>
                <span><strong>Format:</strong> ${formatSelect.value}</span>
                <span><strong>Quality:</strong> ${qualityInput.value}%</span>
            `;

            compressedSize.textContent =
                formatBytes(blob.size);

            const saved =
                (
                    (
                        (selectedFile.size - blob.size)
                        /
                        selectedFile.size
                    )
                    *
                    100
                ).toFixed(1);

            reduction.textContent =
                saved + "%";

            downloadBtn.disabled = false;

            progressBar.style.width = "100%";

            setTimeout(() => {

                progressBar.style.width = "0%";

            },1200);

        }, formatSelect.value, quality);

    },300);
});

downloadBtn.addEventListener("click", () => {

    if(!compressedBlob){
        return;
    }

    const extensionMap = {
        "image/jpeg":"jpg",
        "image/png":"png",
        "image/webp":"webp"
    };

    const extension =
        extensionMap[formatSelect.value] || "jpg";

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(compressedBlob);

    link.download =
        "compressed-image." + extension;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
});

resetBtn.addEventListener("click", () => {

    selectedFile = null;
    compressedBlob = null;
    imageObject = null;

    originalPreview.src = "";
    compressedPreview.src = "";

    originalInfo.innerHTML =
        "<span>No image selected</span>";

    compressedInfo.innerHTML =
        "<span>Compressed image will appear here</span>";

    originalSize.textContent = "0 KB";
    compressedSize.textContent = "0 KB";
    reduction.textContent = "0%";

    widthInput.value = "";
    heightInput.value = "";

    qualityInput.value = "80";

    progressBar.style.width = "0%";

    downloadBtn.disabled = true;
});

function formatBytes(bytes){

    if(bytes === 0){
        return "0 Bytes";
    }

    const sizes = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];

    const i =
        Math.floor(
            Math.log(bytes)
            /
            Math.log(1024)
        );

    return (
        parseFloat(
            (
                bytes
                /
                Math.pow(1024, i)
            ).toFixed(2)
        )
        +
        " "
        +
        sizes[i]
    );
}
</script>

</body>
</html>
